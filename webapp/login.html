<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>담당자 로그인</title>
<style>
:root{--ink:#16233B;--muted:#5A6880;--paper:#EEF2F7;--line:#D5DCE7;--action:#1F5FD1;--s-normal:#1E7A4F;font-family:Pretendard,"Pretendard Variable","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.6;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;border-top:6px solid var(--s-normal)}a{color:var(--action)}
:focus-visible{outline:3px solid var(--action);outline-offset:2px;border-radius:4px}
.top{max-width:420px;margin:56px auto 0;padding:0 18px}.top h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.02em}.top p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.wrap{max-width:420px;margin:18px auto;padding:0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px}
label{display:block;font-weight:700;margin:12px 0 6px}label:first-child{margin-top:0}input{width:100%;font:inherit;padding:12px;border:1px solid #BFC9D8;border-radius:10px;color:var(--ink)}
button{font:inherit;font-weight:700;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:12px 16px;min-height:46px;cursor:pointer;margin-top:18px;width:100%}button:hover{filter:brightness(1.15)}button:disabled{opacity:.6;cursor:wait}
.err{color:#A3182A;margin-top:12px;min-height:1.2em}.muted{color:var(--muted);font-size:.88rem}.note{font-size:.86rem;color:var(--muted);margin:14px 0 0}
</style></head><body>
<header class="top"><h1>재난 안전 AI 상황실</h1><p>담당자 계정으로 로그인하세요.</p></header>
<main class="wrap">
<section class="card"><form id="loginForm"><label for="username">사용자 이름</label><input id="username" autocomplete="username" maxlength="50" required autofocus><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" maxlength="200" required><button id="submit" type="submit">로그인</button><div id="msg" class="err" role="alert"></div></form>
<p class="note">계정이 없으면 서버를 실행하는 PC에서 <code>python scripts/create_user.py 이름 --role operator</code>로 만드세요.</p></section>
<p class="note">교육용 시연 시스템입니다. 실제 재난 대응에 쓰지 말고, 다른 서비스에서 쓰는 비밀번호를 넣지 마세요. · <a href="/">처음으로</a></p></main>
<script>
const $=id=>document.getElementById(id);
function nextPath(){const n=new URLSearchParams(location.search).get('next')||'/admin';return /^\/(?!\/)/.test(n)?n:'/admin'}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=$('submit');b.disabled=true;$('msg').textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);location.href=nextPath()}catch(err){$('msg').textContent=err.message;$('password').value=''}finally{b.disabled=false}});
</script></body></html>
